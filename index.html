<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Play Hangman — a classic word guessing game with a beautiful dark UI. Guess the hidden word before the figure is complete!">
  <title>Hangman Game 🎮</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Floating background bubbles (generated by script.js) -->

  <div class="container" role="main">
    <h1>Hangman</h1>

    <!-- Score -->
    <div class="score" aria-label="Score">
      <span id="wins" class="score-pill">
        <span class="score-icon" aria-hidden="true">🏆</span>
        <span class="score-label">Wins</span>
        <span class="score-value" id="winsValue">0</span>
      </span>
      <span id="losses" class="score-pill">
        <span class="score-icon" aria-hidden="true">💀</span>
        <span class="score-label">Losses</span>
        <span class="score-value" id="lossesValue">0</span>
      </span>
    </div>

    <div class="game-box">
      <!-- Canvas drawing area -->
      <canvas id="hangmanCanvas" width="220" height="260" aria-label="Hangman drawing"></canvas>

      <!-- Hint -->
      <p id="hintText" class="hint"></p>

      <!-- Word blanks -->
      <p class="word" id="wordDisplay" aria-live="polite"></p>

      <!-- Result message -->
      <p id="message" role="alert"></p>

      <!-- On-screen keyboard -->
      <div id="keyboard" class="keyboard" aria-label="Letter keyboard"></div>

      <!-- Restart -->
      <button id="restartBtn" aria-label="Restart game">🔄 New Game</button>
    </div>
  </div>

  <!-- Win overlay -->
  <div id="winEmoji" class="win-emoji" aria-live="assertive">🎉 You Win! 🎉</div>

  <script src="script.js"></script>
</body>
</html>
